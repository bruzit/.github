---
organization:
  environments:
    release:
      deployment_branches:
        - ~DEFAULT_BRANCH
      variables:
        GH_SEM_REL_APP_ID: "3144447"
      secrets:
        - GH_SEM_REL_APP_PEM_FILE
  rulesets:
    default-branch:
      bypass_apps:
        - 3144447 # bruzit-github-contents (semantic-release)
repositories:
  - name: .github
    description: "BruzIT organization profile and the declarative YAML definition of its repositories, reconciled into GitHub by GitHub Organization as Code."
    topics:
      - github-organization
      - organization-profile
      - github-profile
      - github-profile-readme
      - gitops
      - configuration-as-code
      - declarative-configuration
      - iac
      - terraform
      - yaml
    environments:
      production:
        deployment_branches:
          - ~DEFAULT_BRANCH
        variables:
          GH_TF_OWNER: "bruzit"
          GH_TF_APP_ID: "3090257"
          GH_TF_APP_INSTALLATION_ID: "116364646"
          AWS_TF_BUCKET: "bruzit-terraform-github"
          AWS_ENDPOINT_URL_S3: "https://bb6cb15aacaccf32101aab14a9cf3bfd.r2.cloudflarestorage.com"
        secrets:
          - GH_TF_APP_PEM_FILE
          - AWS_ACCESS_KEY_ID
          - AWS_SECRET_ACCESS_KEY
  - name: ansible-collection
    description: "Ansible collection of Molecule-tested roles that provision and maintain Kubuntu desktops and Ubuntu servers."
    topics:
      - ansible
      - ansible-collection
      - ansible-roles
      - ansible-galaxy
      - molecule
      - configuration-management
      - provisioning
      - ubuntu
      - kubuntu
      - ubuntu-server
      - linux-desktop
      - automation
      - devops
      - iac
  - name: github-actions-and-workflows
    description: "Reusable GitHub Actions workflows forming the CI baseline for every BruzIT repository: semantic-release versioning and MegaLinter linting."
    topics:
      - github-actions
      - reusable-workflows
      - composite-actions
      - ci-cd
      - continuous-integration
      - release-automation
      - semantic-release
      - conventional-commits
      - semver
      - megalinter
      - linting
      - workflow-automation
      - devops
    rulesets:
      default-branch: ~ # releases with GITHUB_TOKEN, which cannot bypass
  - name: github-organization-as-code
    description: "GitOps workflow turning a declarative YAML organization definition into GitHub resources with Terraform, authenticated by a GitHub App."
    topics:
      - github-organization
      - organization-as-code
      - configuration-as-code
      - gitops
      - terraform
      - terraform-github-provider
      - github-app
      - infrastructure-as-code
      - iac
      - github-actions
      - reusable-workflows
      - platform-engineering
      - devops
      - yaml
    environments:
      test:
        deployment_branches:
          - ~DEFAULT_BRANCH
        variables:
          GH_TF_OWNER: "bruzit-test"
          GH_TF_APP_ID: "3090257"
          GH_TF_APP_INSTALLATION_ID: "118012158"
          AWS_TF_BUCKET: "bruzit-terraform-github"
          AWS_ENDPOINT_URL_S3: "https://bb6cb15aacaccf32101aab14a9cf3bfd.r2.cloudflarestorage.com"
        secrets:
          - GH_TF_APP_PEM_FILE
          - AWS_ACCESS_KEY_ID
          - AWS_SECRET_ACCESS_KEY
  - name: infra
    description: "Infrastructure blueprints for workstations, home network, edge Kubernetes lab, and self-hosted services, provisioned with Ansible and Terraform under GitOps."
    topics:
      - infrastructure-as-code
      - iac
      - gitops
      - ansible
      - terraform
      - kubernetes
      - homelab
      - selfhosted
      - self-hosting
      - workstation
      - ubuntu
      - kubuntu
      - automation
      - monorepo
      - platform-engineering
      - sre
    rulesets:
      default-branch: ~ # releases with GITHUB_TOKEN, which cannot bypass
  - name: template
    description: "Repository template for BruzIT projects: MegaLinter and semantic-release callers, release configuration, license and README skeleton."
    topics:
      - repository-template
    is_template: true
